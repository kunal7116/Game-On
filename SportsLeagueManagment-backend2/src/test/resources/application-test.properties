# ---------------------------------------------------------------
# Test profile — used by SportsLeagueApplicationTests in CI.
# Uses H2 in-memory database so no real MySQL is needed during
# the GitHub Actions build-backend job.
# ---------------------------------------------------------------

# Switch datasource to H2 in-memory for tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Let Hibernate create the schema from entities in tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Provide a dummy JWT secret so JwtUtils @PostConstruct does not throw
app.jwt.secret=dGVzdC1zZWNyZXQta2V5LWZvci1jaS10ZXN0cy1vbmx5LW5vdC1mb3ItcHJvZHVjdGlvbgo=
EXP_TIMEOUT=300000
app.frontend.origin=http://localhost:3000
APP_ENV=local
