# ---------------------------------------------------------------
# Server
# ---------------------------------------------------------------
server.servlet.session.persistent=false

# ---------------------------------------------------------------
# Database
# Spring Boot reads SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD
# from environment variables automatically (Spring Boot's relaxed
# binding converts the env-var names to property keys).
# When running locally without Docker, these fall back to the
# values below.  When running in Docker Compose the environment
# variables set in docker-compose.yml override them.
# ---------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/sportsLeague_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root123

# ---------------------------------------------------------------
# JPA / Hibernate
# ---------------------------------------------------------------
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.open-in-view=false

# ---------------------------------------------------------------
# Security / JWT
# JWT_SECRET is read from an environment variable at runtime.
# The value below is a LOCAL DEVELOPMENT FALLBACK ONLY.
# In Docker / production it is always supplied via JWT_SECRET env var.
# EXP_TIMEOUT is in milliseconds (300000 = 5 min for dev).
# ---------------------------------------------------------------
JWT_SECRET=${JWT_SECRET:a9s8df7as9d7f8as7d8f7a9s8df7as9df8as9d7f8a7s9df87a9s8df7}
EXP_TIMEOUT=86400000

# ---------------------------------------------------------------
# CORS
# FRONTEND_ORIGIN is read from an environment variable.
# Falls back to http://localhost:3000 for local development.
# ---------------------------------------------------------------
FRONTEND_ORIGIN=${FRONTEND_ORIGIN:http://localhost:3000}

# ---------------------------------------------------------------
# SSL (disabled for development; enable in production)
# ---------------------------------------------------------------
server.ssl.enabled=false
server.ssl.key-store=classpath:jwtdemo2.p12
server.ssl.key-store-type=pkcs12
server.ssl.key-store-password=test#1234
server.ssl.key-password=test#1234
server.ssl.key-alias=jwtdemo2
