# Nginx configuration for React Router SPA
#
# The key rule is "try_files $uri $uri/ /index.html".
# When a browser navigates directly to a React route like
# /city or /admin-home, Nginx checks:
#   1. Does the exact file exist?  ($uri)
#   2. Does the directory exist?   ($uri/)
#   3. Fall back to index.html     (/index.html) with HTTP 200
#
# Without this, Nginx would return 404 for any URL that is not
# literally a file on disk, breaking React Router completely.

server {
    listen 80;
    server_name localhost;

    # Root directory where npm run build places the static files.
    root /usr/share/nginx/html;
    index index.html;

    # Enable gzip compression for better load times.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    # Main routing rule: serve files if they exist, otherwise
    # hand everything to index.html so React Router can handle it.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets (JS, CSS, images) aggressively.
    # React CRA produces content-hashed filenames, so these
    # files never change — safe to cache for 1 year.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Disable caching for index.html so the browser always
    # fetches the latest entry point when you deploy a new build.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Return 404 for any hidden files (starting with a dot).
    location ~ /\. {
        deny all;
    }
}
